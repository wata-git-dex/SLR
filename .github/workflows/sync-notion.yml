name: Sync Notion → data.json

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image conversion support
        run: sudo apt-get install -y imagemagick libheif-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch from Notion and update index.html
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node fetch-notion.mjs

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- index.html images/; then
            git config user.name "notion-sync-bot"
            git config user.email "actions@github.com"
            git add index.html images/
            git commit -m "Sync Notion data + photos"
            git push
          else
            echo "No changes."
          fi
